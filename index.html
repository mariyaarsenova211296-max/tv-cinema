<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="stv-rebuild" content="stv69-alt-fixed-viewport" />
  <title>Sber TV — Кинотеатр с интеллектом</title>
  <link rel="icon" href="data:," />
  <style>
    /* Outer letterbox only — landing lives in a fixed 1440×860 iframe (inner.html). */
    html, body {
      margin: 0;
      padding: 0;
      background: #FFFFFF;
      width: 100%;
      min-height: 100%;
    }
    body {
      /* Smaller windows: keep 1440×860; outer page scrolls — no auto-shrink. */
      overflow: auto;
    }
    .viewport-shell {
      display: block;
      width: 1440px;
      height: 860px;
      margin: 0 auto; /* centered horizontally, flush to top */
      border: 0;
      background: #000;
      /* Never stretch/scale with the browser window */
      max-width: none;
      max-height: none;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <iframe
    class="viewport-shell"
    src="./inner.html"
    title="Sber TV — Кинотеатр с интеллектом"
    width="1440"
    height="860"
    allow="autoplay; fullscreen"
    loading="eager"
    referrerpolicy="same-origin"
  ></iframe>
</body>
</html>
