<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="stv-rebuild" content="stv71-alt-shell-fit-scale" />
  <title>Sber TV — Кинотеатр с интеллектом</title>
  <link rel="icon" href="data:," />
  <style>
    /* Outer letterbox — landing lives in a fixed 1440×860 iframe (inner.html),
       proportionally fit-scaled into the CSS-px viewport (never > 1). */
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    /* Layout footprint = renderWidth×renderHeight (no outer scroll). */
    #shell-frame {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    /* Design-sized iframe; visual size comes from transform scale. */
    #shell-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 860px;
      border: 0;
      background: #000;
      display: block;
      max-width: none;
      max-height: none;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="shell-frame">
      <iframe
        id="viewport-shell"
        src="./inner.html"
        title="Sber TV — Кинотеатр с интеллектом"
        width="1440"
        height="860"
        allow="autoplay; fullscreen"
        loading="eager"
        referrerpolicy="same-origin"
      ></iframe>
    </div>
  </div>
  <script>
    (function () {
      var DESIGN_W = 1440;
      var DESIGN_H = 860;
      var frame = document.getElementById('shell-frame');
      var iframe = document.getElementById('viewport-shell');

      function fit() {
        // CSS-px available area (not screen.* / devicePixelRatio)
        var vw = document.documentElement.clientWidth || window.innerWidth || DESIGN_W;
        var vh = document.documentElement.clientHeight || window.innerHeight || DESIGN_H;
        var scale = Math.min(1, vw / DESIGN_W, vh / DESIGN_H);
        var renderW = DESIGN_W * scale;
        var renderH = DESIGN_H * scale;

        // Wrapper = rendered footprint so outer page never scrolls.
        frame.style.width = renderW + 'px';
        frame.style.height = renderH + 'px';
        // Iframe stays 1440×860; scale whole iframe from top-left.
        iframe.style.transform = 'scale(' + scale + ')';
      }

      fit();
      window.addEventListener('resize', fit, { passive: true });
    })();
  </script>
</body>
</html>
