<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="stv-rebuild" content="stv72-alt-width-fill-adapt" />
  <title>Sber TV — Кинотеатр с интеллектом</title>
  <link rel="icon" href="data:," />
  <style>
    /*
     * STV-72 outer shell
     * - Width ≤1440: fill 100% available width (no side bars)
     * - Width >1440: max 1440, centered, black sides
     * - Scale is WIDTH-ONLY (never min(w,h) — that caused side bars on short windows)
     * - Design height stays 860 when 860*scale ≤ vh (black below); otherwise
     *   iframe height shrinks to vh/scale so inner can adapt layout (no overflow)
     */
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    /* Layout footprint = renderWidth×renderHeight (no outer scroll). */
    #shell-frame {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    /* Design-width iframe; visual size comes from transform scale. */
    #shell-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      /* height set by JS (860 or vh/scale when short) */
      height: 860px;
      border: 0;
      background: #000;
      display: block;
      max-width: none;
      max-height: none;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="shell-frame">
      <iframe
        id="viewport-shell"
        src="./inner.html"
        title="Sber TV — Кинотеатр с интеллектом"
        width="1440"
        height="860"
        allow="autoplay; fullscreen"
        loading="eager"
        referrerpolicy="same-origin"
      ></iframe>
    </div>
  </div>
  <script>
    (function () {
      var DESIGN_W = 1440;
      var DESIGN_H = 860;
      var frame = document.getElementById('shell-frame');
      var iframe = document.getElementById('viewport-shell');

      function fit() {
        // CSS-px available area (not screen.* / devicePixelRatio)
        var vw = document.documentElement.clientWidth || window.innerWidth || DESIGN_W;
        var vh = document.documentElement.clientHeight || window.innerHeight || DESIGN_H;

        // WIDTH-ONLY scale — fills width ≤1440; never shrink for short height
        // (that would create side black bars). Cap at 1 for wide monitors.
        var scale = Math.min(1, vw / DESIGN_W);
        var renderW = DESIGN_W * scale;
        var idealRenderH = DESIGN_H * scale;

        // If width-fit scene is shorter than the window → black below (don't stretch).
        // If taller than the window → shrink design height so inner can adapt layout.
        var designH = DESIGN_H;
        var renderH = idealRenderH;
        if (idealRenderH > vh) {
          designH = vh / scale;
          renderH = vh;
        }

        frame.style.width = renderW + 'px';
        frame.style.height = renderH + 'px';
        iframe.style.width = DESIGN_W + 'px';
        iframe.style.height = designH + 'px';
        iframe.setAttribute('height', String(Math.round(designH)));
        iframe.style.transform = 'scale(' + scale + ')';
      }

      fit();
      window.addEventListener('resize', fit, { passive: true });
    })();
  </script>
</body>
</html>
